site_name: Loupe
site_description: A platform of analysis lenses for software-engineering risk activities. v1 ships ThreatLens for diff-aware STRIDE threat modelling and EU CRA Annex I evidence.
site_url: https://fadilabib.github.io/loupe/
repo_url: https://github.com/fadilabib/loupe
repo_name: fadilabib/loupe
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

# Footer copyright line. Apache 2.0 grants reuse/modification rights, so we
# do not add "All rights reserved" — that phrase would contradict the
# license and is redundant under Berne-Convention auto-copyright anyway.
# The copyright notice itself IS required: every permissive licence needs
# a clear owner to operate against.
copyright: >
  Copyright &copy; 2026 Fadi Labib ·
  <a href="https://github.com/fadilabib/loupe/blob/main/LICENSE">Apache 2.0</a> ·
  <a href="https://github.com/fadilabib/loupe/blob/main/SECURITY.md">Security</a> ·
  <a href="changelog/">Changelog</a>

# Local-only plan/spec subdirs (kept on disk via .git/info/exclude) should
# not get built into the published site.
exclude_docs: |
  plans/
  specs/

theme:
  name: material
  # The overrides/ directory at the repo root holds the announce-banner
  # template (overrides/main.html). Kept outside docs/ so MkDocs doesn't
  # try to build it as a page.
  custom_dir: overrides
  # Custom SVG mark replaces Material's stock magnify icon. Lives under
  # docs/assets/ so it ships into the built site automatically.
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  # Cold-only palette from the personal-website BRAND.md: navy #0F1E3D
  # primary, indigo #4F46E5 / navy #93C5FD accent (light/dark), cyan
  # #06B6D4 for section labels. Material 9.x respects `custom` and reads
  # the actual values from CSS variables in docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Geist single-family across body + headings + code. Material auto-loads
  # from Google Fonts (Geist + Geist Mono ship there as of 2025).
  font:
    text: Geist
    code: Geist Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss          # show the pre-alpha banner, dismissible
    - navigation.instant
    - navigation.instant.prefetch  # prefetch on hover, site feels instantaneous
    - navigation.instant.progress  # subtle top-of-page progress bar between pages
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune          # render only the active section in the sidebar
    - navigation.top
    - navigation.path
    - navigation.footer         # Prev/Next links at the bottom of every page
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips          # tooltips for any element with a `title` attr; powers glossary auto-tooltips
    - content.footnote.tooltips # hover-preview footnotes (used by comparison.md)
    - content.action.edit
    - content.action.view       # "view source" link next to "edit" on every page

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Tutorials:
      - Overview: tutorials/index.md
  - How-to:
      - Overview: how-to/index.md
      - Run the MCP server: how-to/run-mcp-server.md
  - Principles: principles.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Capabilities: concepts/capabilities.md
  - Reference:
      - CLI: reference/cli.md
      - MCP tools: reference/mcp-tools.md
      - Config: reference/config.md
      - .loupe layout: reference/loupe-directory.md
      - Verification: reference/verification.md
      - Versioning: reference/versioning.md
      - Decisions: reference/decisions.md
      - Glossary: reference/glossary.md
      - Data handling: reference/data-handling.md
      - Pricing: reference/pricing.md
      - Threat model of Loupe: reference/loupe-threat-model.md
      - Evaluation: reference/evaluation.md
      - Schemas:
          - Overview: reference/schemas/index.md
          - Threat: reference/schemas/threat.md
          - Mitigation: reference/schemas/mitigation.md
          - RunRecord: reference/schemas/run-record.md
          - ProjectContext: reference/schemas/project-context.md
          - KnowledgeGraph: reference/schemas/knowledge.md
          - Capability results: reference/schemas/capabilities.md
  - Roadmap: roadmap.md
  - About: about.md
  - Comparison: comparison.md
  - Contributing: contributing.md
  - Changelog: changelog.md
  - Tags: tags.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - abbr
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve --8<-- "path:start:end" relative to the repo root so
      # docs can include real source ranges from packages/ without
      # path gymnastics. check_paths makes a missing target fail the
      # build the same way a broken link does.
      base_path:
        - .
      check_paths: true
      # Inject the glossary abbreviation file into every page so any
      # term documented in includes/abbreviations.md renders as a
      # hover-tooltip wherever it appears in prose. Single source of
      # truth: edit includes/abbreviations.md when adding a term.
      auto_append:
        - includes/abbreviations.md
  - pymdownx.smartsymbols
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      separator: '[\s\-\.]+'
  - tags                    # the [TAGS] placeholder in docs/tags.md becomes a tag-browser index (file auto-detected)
  - callouts                # Convert GitHub-style > [!NOTE] alerts to Material admonitions
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: false
      # The plans/ and specs/ subdirs are kept on disk for local reference
      # but never tracked in git (.git/info/exclude). Skip them so the
      # plugin does not warn about missing git history.
      exclude:
        - plans/*
        - specs/*
  # Material's social-card plugin generates OG previews per page so shared
  # links look polished on Slack, X, GitHub PRs, etc.
  - social:
      cards_layout_options:
        background_color: "#5e35b1"   # deep purple, matches the theme palette
        color: "#ffffff"
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/loupe-core
            - packages/loupe-cli
            - packages/loupe-threatlens
            - packages/loupe-action
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  # `mike` writes versioned doc copies to the gh-pages branch
  # (`mike deploy <version> latest --update-aliases --push`). The Material
  # theme renders a version-picker dropdown in the header once at least
  # one version is deployed. Until the first `mike deploy` runs, the
  # picker is hidden; the live site keeps serving from the current
  # actions/deploy-pages flow with no observable change.
  version:
    provider: mike
    default: latest
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fadilabib/loupe
      name: Source on GitHub
