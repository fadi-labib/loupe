[project]
name = "loupe-cli"
version = "0.0.1"
description = "Loupe CLI — chat, ci, mcp, init, verify"
requires-python = ">=3.13"
dependencies = [
    "loupe-core",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
loupe = "loupe_cli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe_cli"]

[tool.uv.sources]
loupe-core = { workspace = true }
