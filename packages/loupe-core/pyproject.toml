[project]
name = "loupe-core"
version = "0.0.1"
description = "Loupe platform core — coordinator, run context, enforcement, MCP server"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    # pydantic-ai 1.x is current; cap below 2.0 so a future major release
    # doesn't break us silently. The codebase uses 1.x APIs (tool registration
    # via `_function_toolset`, etc.) — anything lower than 1.0 would break.
    "pydantic-ai>=1.0,<2",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    # MCP server (third frontend, per D-09). Uses the official Anthropic
    # `mcp` SDK's high-level FastMCP API; not the third-party `fastmcp`
    # package — see D-21 for the rationale. Cap below 2.0 — the SDK is
    # still pre-1.0 stable in practice and reserves the right to break.
    "mcp>=1.0,<2",
]

[project.entry-points."loupe.capabilities"]
syft = "loupe_core.capabilities.backends.syft_sbom:SyftSbomBackend"
cdxgen = "loupe_core.capabilities.backends.cdxgen_sbom:CdxgenSbomBackend"
grype = "loupe_core.capabilities.backends.grype_cve:GrypeCveBackend"
gitleaks = "loupe_core.capabilities.backends.gitleaks_secret:GitleaksSecretBackend"
trufflehog = "loupe_core.capabilities.backends.trufflehog_secret:TruffleHogSecretBackend"
semgrep = "loupe_core.capabilities.backends.semgrep_static:SemgrepStaticBackend"
codeql = "loupe_core.capabilities.backends.codeql_static:CodeQLStaticBackend"
bandit = "loupe_core.capabilities.backends.bandit_static:BanditStaticBackend"
osv-scanner = "loupe_core.capabilities.backends.osv_scanner_cve:OsvScannerCveBackend"
detect-secrets = "loupe_core.capabilities.backends.detect_secrets:DetectSecretsBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe_core"]
