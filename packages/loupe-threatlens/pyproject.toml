[project]
name = "loupe-threatlens"
version = "0.0.1"
description = "ThreatLens — Loupe lens for STRIDE threat modeling + CRA evidence"
requires-python = ">=3.13"
dependencies = ["loupe-core"]

[project.entry-points."loupe.lenses"]
threatlens = "loupe_threatlens.lens:ThreatLens"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loupe_threatlens"]

[tool.uv.sources]
loupe-core = { workspace = true }
