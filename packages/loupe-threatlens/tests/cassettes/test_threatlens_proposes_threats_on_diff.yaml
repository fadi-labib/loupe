      a human will edit it via a separate workflow.\\n- Modify `decisions/`. Risk
      acceptances are human-authored.\\n- Edit `config.yaml`.\\n- Speculate about
      future architecture not present in the inputs.\\n- Generate Gherkin tests, DREAD
      scores, or attack trees. Those are not in scope for ThreatLens v1.\\n\",\"temperature\":0.0,\"tool_choice\":{\"type\":\"auto\"},\"tools\":[{\"name\":\"propose_threat\",\"description\":\"Propose
