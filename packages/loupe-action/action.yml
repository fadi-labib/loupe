# Layer 2 (branch-namespace enforcement) — SHIPPED in v0.1.
#
# When `auto_commit_loupe_dir: true`, the Action authenticates with the
# fine-grained PAT supplied via `LOUPE_PAT` env or `loupe_pat` input.
# The PAT MUST be scoped:
#   - `contents: write` only on refs matching `loupe/proposal-*`
#   - `pull-requests: write` for sticky comment + sub-PR creation
#   - `contents: read` on the default branch (diff/SHA fetch)
#   - `metadata: read` (always required by GitHub for fine-grained PATs)
#
# Combined with CODEOWNERS guarding `.loupe/context.md`, `.loupe/decisions/`,
# `.loupe/config.yaml`, and `.loupe/knowledge.yaml`, this gives Layer 2 its
# branch-namespace property regardless of what the in-process Layer 1
# boundary lets through.
#
# When `auto_commit_loupe_dir: false` (the default), the Action only reads
# the repo (PR fetch) and posts the sticky comment via the default
# GITHUB_TOKEN — no PAT required and no Layer-2 enforcement is exercised
# because no pushes happen. See decisions.md D-08, D-26, and D-27.

name: 'Loupe'
description: 'Run Loupe lenses on a pull request and post a sticky threat-model comment (pre-alpha; install from source until v0.1 ships)'
inputs:
  pr:
    description: 'Pull request number (digits only)'
    required: true
  config:
    description: 'Path to the loupe config file, relative to the workspace'
    required: false
    default: '.loupe/config.yaml'
  comment_mode:
    description: |
      How to post the analysis comment on the PR:
        sticky  (default) — edit a single comment in place across pushes
        new               — post a fresh comment each run
        none              — do not post any comment
    required: false
    default: 'sticky'
  auto_commit_loupe_dir:
    description: |
      Push .loupe/ artefacts to a `loupe/proposal-<pr-id>` side branch
      and open a sub-PR targeting the original PR's branch. Requires
      LOUPE_PAT env or loupe_pat input. Default: false (no push happens;
      sticky comment is the only output).
    required: false
    default: 'false'
  commit_author:
    description: |
      Author identity for auto-commits on the side branch.
      Format: `Name <email>`. Default: `loupe-agent <noreply@loupe.security>`.
    required: false
    default: 'loupe-agent <noreply@loupe.security>'
  loupe_pat:
    description: |
      Fine-grained PAT scoped to push to refs matching `loupe/proposal-*`.
      Required when auto_commit_loupe_dir=true unless LOUPE_PAT env is set.
      See docs/reference/data-handling.md for PAT setup.
    required: false
    default: ''
outputs:
  findings_count:
    description: 'Total number of threats reported by this run'
    value: ${{ steps.loupe.outputs.findings_count }}
  findings_critical:
    description: 'Number of critical-severity threats'
    value: ${{ steps.loupe.outputs.findings_critical }}
  findings_high:
    description: 'Number of high-severity threats'
    value: ${{ steps.loupe.outputs.findings_high }}
  findings_medium:
    description: 'Number of medium-severity threats'
    value: ${{ steps.loupe.outputs.findings_medium }}
  findings_low:
    description: 'Number of low-severity threats'
    value: ${{ steps.loupe.outputs.findings_low }}
  run_id:
    description: 'Run identifier (matches the .loupe/runs/<id>.json filename)'
    value: ${{ steps.loupe.outputs.run_id }}
  run_hash:
    description: 'Self-hash of the run record (links into the audit chain)'
    value: ${{ steps.loupe.outputs.run_hash }}
  exit_code:
    description: 'Final exit code (0 clean, 1 gate failed, 64 usage / configuration error)'
    value: ${{ steps.loupe.outputs.exit_code }}
  sub_pr_url:
    description: 'URL of the auto-commit sub-PR (empty when auto_commit_loupe_dir is false or push failed).'
    value: ${{ steps.loupe.outputs.sub_pr_url }}
runs:
  using: 'composite'
  steps:
    - name: Validate inputs (bash-side defence in depth)
      shell: bash
      env:
        INPUT_PR: ${{ inputs.pr }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COMMENT_MODE: ${{ inputs.comment_mode }}
        INPUT_AUTO_COMMIT_LOUPE_DIR: ${{ inputs.auto_commit_loupe_dir }}
        INPUT_COMMIT_AUTHOR: ${{ inputs.commit_author }}
        INPUT_LOUPE_PAT: ${{ inputs.loupe_pat }}
      run: |
        set -euo pipefail

        if ! [[ "${INPUT_PR}" =~ ^[0-9]+$ ]]; then
          echo "::error::pr input must be digits only, got: ${INPUT_PR}" >&2
          exit 64
        fi

        case "${INPUT_CONFIG}" in
          *$'\n'*|*$'\0'*|*';'*|*'|'*|*'&'*|*'`'*|*'$('*)
            echo "::error::config input contains disallowed characters" >&2
            exit 64
            ;;
        esac

        case "${INPUT_COMMENT_MODE}" in
          sticky|new|none) ;;
          *)
            echo "::error::comment_mode must be sticky, new, or none" >&2
            exit 64
            ;;
        esac

    - name: Install Loupe
      shell: bash
      run: |
        # Pre-PyPI: install from source so consumers pin to the commit-SHA
        # of the action ref. An unpinned `pip install loupe-action` would
        # mean a single bad PyPI release breaks every consumer at once —
        # hostile to the run-reproducibility commitment (principle §1).
        #
        # Once v0.1 ships to PyPI, switch this step to:
        #   pip install \
        #     "loupe-core==${ACTION_VERSION}" \
        #     "loupe-cli==${ACTION_VERSION}" \
        #     "loupe-action==${ACTION_VERSION}" \
        #     "loupe-threatlens==${ACTION_VERSION}"
        # where ACTION_VERSION is bumped at release time.
        pip install \
          "${{ github.action_path }}/../loupe-core" \
          "${{ github.action_path }}/../loupe-cli" \
          "${{ github.action_path }}" \
          "${{ github.action_path }}/../loupe-threatlens"

    - name: Run Loupe
      id: loupe
      shell: bash
      env:
        INPUT_PR: ${{ inputs.pr }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_COMMENT_MODE: ${{ inputs.comment_mode }}
        INPUT_AUTO_COMMIT_LOUPE_DIR: ${{ inputs.auto_commit_loupe_dir }}
        INPUT_COMMIT_AUTHOR: ${{ inputs.commit_author }}
        INPUT_LOUPE_PAT: ${{ inputs.loupe_pat }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        LOUPE_PAT: ${{ env.LOUPE_PAT }}
      run: |
        python -m loupe_action.entrypoint
