name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # Pin to a v4.x minor for the action itself; pin uv (the tool) to
        # 0.5.x via `version`. Same convention as the docs workflow.
        uses: astral-sh/setup-uv@v4.1
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync workspace
        # NOTE: --frozen is intentionally omitted because `uv.lock` is
        # gitignored (.gitignore L19). CI resolves dependencies fresh on each
        # run. If the project later commits the lockfile, add --frozen here.
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check packages/

      - name: Ruff format check
        run: uv run ruff format --check packages/

      - name: mypy (loupe-core strict)
        run: uv run mypy packages/loupe-core/loupe_core/

      - name: pytest
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: |
          set -o pipefail
          uv run pytest packages/ -q | tee /tmp/pytest.out

      - name: Test summary
        # `if: always()` so the summary appears even when pytest failed —
        # operators triaging a red run want the counts and the last few
        # lines without scrolling the full log. pytest-github-actions-
        # annotate-failures (declared in pyproject.toml dev group) handles
        # the inline-on-PR annotations side of test visibility.
        if: always()
        run: |
          {
            echo '## pytest'
            echo
            echo '```'
            tail -n 3 /tmp/pytest.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
