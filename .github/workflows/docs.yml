# Build the MkDocs site and deploy to GitHub Pages.
#
# Security note: this workflow uses no untrusted inputs from github.event.*;
# the only template substitution is ${{ steps.deployment.outputs.page_url }},
# which is produced by the deploy-pages action itself.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'packages/**/*.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install docs dependencies
        # The docs group pins mkdocs, mkdocs-material, mkdocs-callouts, and
        # mkdocstrings[python]. mkdocstrings needs the workspace packages
        # importable so it can render the Pydantic models; --all-packages
        # installs every workspace member in editable mode.
        run: uv sync --all-packages --group docs

      - name: Build site
        run: uv run mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
