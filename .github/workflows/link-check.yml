# Run lychee against the repo's Markdown to catch broken links before merge.
#
# Security note: this workflow uses no untrusted inputs from github.event.*;
# the only template substitution is ${{ github.sha }} (the commit SHA, not
# user-controlled). The lychee-action receives static config from lychee.toml.

name: link-check

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/link-check.yml'
      - 'lychee.toml'

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --cache --max-cache-age 7d --config lychee.toml './**/*.md'
          fail: true
