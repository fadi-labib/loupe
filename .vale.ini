# Vale configuration. Run locally with:
#
#     vale --config .vale.ini docs/
#
# CI runs the same check via .github/workflows/prose-check.yml.
# Custom Loupe rules live under .vale/styles/Loupe/ and enforce the
# voice we hand-applied during the humanizer pass: no em-dash overuse,
# no bold-prefixed sentence openers, no AI-vocabulary smell-test words.

StylesPath = .vale/styles

MinAlertLevel = warning

Packages = Google

[*.md]
BasedOnStyles = Loupe, Google

# Google style has a few rules that fight a technical-docs voice; tone
# down the most aggressive ones rather than disabling the package wholesale.
Google.Acronyms = NO              # We use STRIDE / CVE / SBOM frequently; no need to expand.
Google.FirstPerson = warning      # 'I' is fine in CONTRIBUTING-style prose.
Google.Headings = NO              # Headings policy is enforced by the Loupe style instead.
Google.We = NO                    # 'we' is fine in design-decision prose.

# Exclude rendered build output and local-only dev artefacts.
[formats]
*.md = md

[*]
TokenIgnores = (?s) {0,4}```.*?```, `[^`\n]+`
