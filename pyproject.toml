[project]
name = "loupe-workspace"
version = "0.0.0"
description = "Loupe — a platform of analysis lenses for software-engineering risk"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

# PEP-735 dependency groups (replaces the deprecated `tool.uv.dev-dependencies`).
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-vcr>=1.0",
    # Auto-detects GITHUB_ACTIONS=true and emits ::error file=...,line=...::
    # workflow commands on test failure, so failed assertions show up as
    # inline annotations on the PR Files Changed view + Checks panel.
    # No-op outside CI; no configuration required.
    "pytest-github-actions-annotate-failures>=0.2",
    "ruff>=0.7",
    "mypy>=1.13",
    # httpx: already a transitive dep of loupe-core/loupe-action via `mcp`
    # and their own direct declarations, but loupe-cli's test suite now
    # imports it directly (test_mcp_sse_auth.py) — declare it explicitly
    # so that stays true even if those packages' deps shift.
    "httpx>=0.27",
    # uvicorn: only a transitive dep of `mcp` (its SSE/streamable-http
    # transports). test_mcp_sse_auth.py runs a real uvicorn server to
    # test the SSE auth contract end-to-end, so it's a direct test dep.
    "uvicorn>=0.34",
]
docs = [
    # mkdocs-material 9.7+ prints an advocacy banner against upstream
    # MkDocs 2.0 on every invocation; pin under that until they remove it.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<9.7",
    "pymdown-extensions>=10.0",
    "mkdocs-callouts>=1.13",
    "mkdocstrings[python]>=0.26",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    # Versioned docs: `mike deploy <version> latest` writes the built
    # site to the gh-pages branch under a versioned directory and the
    # Material theme renders a version-picker dropdown in the header.
    # Wired via theme.extra.version.provider in mkdocs.yml.
    "mike>=2.1",
    # Material social-card generation needs cairo + pango + the
    # python pillow bindings. ubuntu-latest runners ship cairo/pango;
    # the pip-installable bit is here.
    "pillow>=10",
    "cairosvg>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
# ANN101/ANN102 (typing of `self`/`cls`) were removed from ruff — they need
# no entry here. ANN401 (banning `Any`) is too strict for our protocol
# layer; the framework legitimately uses `Any` for dependency-injection
# type erasure.
ignore = ["ANN401"]

# Tests don't need strict type annotations. Test runners discover them by
# attribute name; explicit `-> None` on every test function adds noise
# without catching bugs. F841 (unused-variable) is also relaxed in tests
# because fixtures bind names that may not be used by every test.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN001", "ANN003", "ANN201", "ANN202", "ANN204", "F841"]
# Typer CLI handlers use `typer.Option(...)` calls in argument defaults by
# design — that's the framework's parameter-introspection API. B008's
# "no function calls in defaults" rule produces false positives here.
"**/loupe_cli/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "tests", "benchmarks/scoring/tests"]
addopts = "--import-mode=importlib"
# benchmarks/scoring is a plain package (not a packages/* workspace
# member — it's not shipped, it's the orchestrator's scoring engine),
# so it needs an explicit path entry to be importable as `scoring.*`
# from its own tests.
pythonpath = ["benchmarks"]

[tool.mypy]
strict = true
python_version = "3.13"
# Test modules are checked but allowed to be sloppy. Pydantic models in
# tests don't always declare their full type chain, and the importlib
# pytest mode means multiple `test_smoke.py` modules coexist — mypy
# would otherwise complain about duplicate module names.
explicit_package_bases = true
exclude = [
    "packages/[^/]+/tests/.*",
    "tests/.*",
]

# The official `mcp` SDK's `mcp.server.fastmcp.FastMCP.tool()` decorator
# ships no type stubs, so every function it decorates is seen as
# untyped. `server` is deliberately typed `Any` here (D-21) so
# loupe-threatlens never takes a hard import dependency on the MCP SDK;
# narrowing that type to silence this would defeat the point.
[[tool.mypy.overrides]]
module = "loupe_threatlens.mcp_tools"
disable_error_code = ["untyped-decorator"]
