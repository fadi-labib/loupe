<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 752" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="lt ld">
<title id="lt">Loupe — compose, inspect, verify</title>
<desc id="ld">A magnifying lens centred on source code. Five capability stages — SBOM (Syft, cdxgen), CVE (Grype, osv-scanner), ThreatLens (Claude, LLM consensus), Secret (gitleaks, TruffleHog), and SAST (Semgrep, CodeQL) — feed into a Merkle-linked run pack at .loupe/runs/01HKXY7Z3F containing five blocks. The pack is then verified end-to-end, and a synthesised REPORT.MD reports PASS, 5 of 5, SHA-256, verified, with 3 high CVEs, 7 threat notes, 12 lints, and zero leaks.</desc>
<style>
.ink{stroke:#1A1A1A;} .acc{stroke:#00875A;}
.pf{fill:#FAFAF9;} .if{fill:#1A1A1A;} .af{fill:#00875A;} .ink-fill{fill:#1A1A1A;}
.dot-amber{fill:#B45309;} .dot-red{fill:#B91C1C;}
.block-fill{fill:#1A1A1A;fill-opacity:0.04;}
.pack-fill{fill:#1A1A1A;fill-opacity:0.03;}
text{font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;}
.lbl{font-size:12px;font-weight:600;letter-spacing:0.10em;fill:#1A1A1A;}
.lbl-tiny{font-size:9.5px;letter-spacing:0.04em;fill:#4B5563;}
.lbl-blockid{font-size:8px;font-weight:600;letter-spacing:0.06em;fill:#1A1A1A;}
.lbl-hash{font-size:8.5px;letter-spacing:0;fill:#4B5563;}
.lbl-blockres-ok{font-size:8.5px;letter-spacing:0.02em;fill:#4B5563;}
.lbl-blockres-bad{font-size:8.5px;font-weight:600;letter-spacing:0.02em;fill:#1A1A1A;}
.report-prose{font-size:9.5px;letter-spacing:0.04em;fill:#1A1A1A;}
.chrome{font-size:9px;letter-spacing:0.18em;fill:#4B5563;}
.chrome-cmd{font-size:9px;letter-spacing:0.06em;fill:#4B5563;}
.chrome-acc{fill:#00875A;font-weight:600;}
.counter{font-size:8.5px;letter-spacing:0.04em;fill:#4B5563;font-variant-numeric:tabular-nums;}
.hdr-l{font-size:9px;letter-spacing:0.04em;fill:#FAFAF9;font-weight:600;}
.hdr-r{font-size:9px;letter-spacing:0.08em;fill:#FAFAF9;opacity:0.8;}
.bg{fill:#FAFAF9;}
@media (prefers-color-scheme:dark){
  .ink{stroke:#E5E7EB;} .acc{stroke:#4ADE80;}
  .pf{fill:#0D0D0D;} .if{fill:#E5E7EB;} .af{fill:#4ADE80;} .ink-fill{fill:#E5E7EB;}
  .dot-amber{fill:#F59E0B;} .dot-red{fill:#EF4444;}
  .block-fill{fill:#E5E7EB;fill-opacity:0.06;}
  .pack-fill{fill:#E5E7EB;fill-opacity:0.04;}
  .lbl,.lbl-blockid,.lbl-blockres-bad,.report-prose{fill:#E5E7EB;}
  .lbl-tiny,.lbl-hash,.lbl-blockres-ok,.chrome,.chrome-cmd,.counter{fill:#D1D5DB;}
  .chrome-acc{fill:#4ADE80;}
  .hdr-l,.hdr-r{fill:#0D0D0D;}
  .bg{fill:#0D0D0D;}
}
</style>

