<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <!-- Loupe (precision magnifier) — uses currentColor so Material recolours it by context -->
  <circle cx="13" cy="13" r="8" stroke="currentColor" stroke-width="2.4"/>
  <line x1="19" y1="19" x2="27.5" y2="27.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Inner glint suggesting "the lens that catches what others miss" -->
  <circle cx="11" cy="11" r="1.6" fill="currentColor" opacity="0.55"/>
</svg>
